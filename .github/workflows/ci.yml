name: DataForge CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[parquet,tests]"
      - name: Run tests
        run: python -m pytest -q
      - name: Check Alembic migrations
        run: |
          DATABASE_URL=sqlite:////tmp/dataforge-ci.db alembic -c backend/alembic.ini upgrade head
          DATABASE_URL=sqlite:////tmp/dataforge-ci.db alembic -c backend/alembic.ini downgrade base
          DATABASE_URL=sqlite:////tmp/dataforge-ci.db alembic -c backend/alembic.ini upgrade head

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
