version: 1.0.0
distinction:
  failure_category: Business/quality class of failure.
  failure_primitive: Reusable mutation strategy that can be parameterized across domains,
    tables, and columns.
categories:
  duplication:
    primitives:
    - duplicate_entity
    - duplicate_transaction
    - duplicate_child_record
    compatible_validators:
    - uniqueness
    - reconciliation
    - scenario_specific
  missing_data:
    primitives:
    - set_required_value_null
    - remove_entity
    - remove_child_record
    compatible_validators:
    - not_null
    - row_count
    - referential_integrity
  invalid_value:
    primitives:
    - replace_with_invalid_enum
    - replace_with_invalid_format
    - datatype_mismatch
    compatible_validators:
    - accepted_values
    - data_type
    - business_rule
  boundary_violation:
    primitives:
    - negative_numeric_value
    - out_of_range_numeric_value
    - future_or_invalid_date
    compatible_validators:
    - range
    - date
    - business_rule
  referential_integrity:
    primitives:
    - break_foreign_key
    - orphan_child_record
    - missing_parent_reference
    compatible_validators:
    - referential_integrity
    - scenario_specific
  temporal:
    primitives:
    - late_event
    - future_timestamp
    - clock_skew
    - settlement_delay
    - invalid_date_sequence
    compatible_validators:
    - temporal_sequence
    - streaming_event
  sequence:
    primitives:
    - out_of_order_events
    - invalid_status_sequence
    - invalid_retry_sequence
    compatible_validators:
    - temporal_sequence
    - scenario_specific
  financial:
    primitives:
    - amount_miscalculation
    - fee_miscalculation
    - currency_conversion_error
    - coverage_amount_exceeded
    compatible_validators:
    - reconciliation
    - business_rule
  aggregate_mismatch:
    primitives:
    - parent_child_total_mismatch
    - ledger_imbalance
    - inventory_reconciliation_mismatch
    compatible_validators:
    - reconciliation
    - aggregate
  status_transition:
    primitives:
    - invalid_status_transition
    - stale_status
    - terminal_state_reversal
    compatible_validators:
    - business_rule
    - lifecycle
  identity_mismatch:
    primitives:
    - duplicate_idempotency_key
    - identity_reference_swap
    - cross_customer_reference
    compatible_validators:
    - identity
    - reconciliation
  volume_anomaly:
    primitives:
    - burst_traffic
    - missing_events
    - unexpected_volume_spike
    compatible_validators:
    - statistical
    - streaming_event
  geographic:
    primitives:
    - gps_jump
    - invalid_location_sequence
    - region_mismatch
    compatible_validators:
    - geographic
    - temporal_sequence
  availability:
    primitives:
    - network_outage
    - service_unavailable
    - machine_downtime
    compatible_validators:
    - availability
    - scenario_specific
  retry:
    primitives:
    - duplicate_retry
    - retry_without_original
    - retry_timeout
    compatible_validators:
    - sequence
    - idempotency
  timeout:
    primitives:
    - delayed_alert
    - processing_timeout
    - late_approval
    compatible_validators:
    - temporal_sequence
    - sla
  fraud_anomaly:
    primitives:
    - suspicious_activity_burst
    - rare_high_value_activity
    - fraud_marker_inconsistency
    compatible_validators:
    - statistical
    - business_rule
  capacity:
    primitives:
    - capacity_overflow
    - inventory_oversell
    - course_overenrollment
    compatible_validators:
    - capacity
    - business_rule
  policy_violation:
    primitives:
    - eligibility_violation
    - coverage_limit_violation
    - registration_hold_violation
    compatible_validators:
    - policy
    - business_rule
  calculation:
    primitives:
    - grade_formula_error
    - premium_miscalculation
    - payment_total_miscalculation
    compatible_validators:
    - calculation
    - reconciliation
  data_format:
    primitives:
    - malformed_json
    - schema_drift
    - column_rename
    - column_remove
    - column_add
    - datatype_change
    compatible_validators:
    - schema
    - data_type
  cross_table_mismatch:
    primitives:
    - related_table_status_mismatch
    - parent_child_state_mismatch
    compatible_validators:
    - cross_table
    - scenario_specific
  distribution_anomaly:
    primitives:
    - class_imbalance
    - outlier_cluster
    - skew_shift
    compatible_validators:
    - statistical
    - realism
  threshold_violation:
    primitives:
    - temperature_threshold_breach
    - defect_rate_spike
    - dropped_call_rate_spike
    compatible_validators:
    - threshold
    - scenario_specific
  lifecycle_violation:
    primitives:
    - invalid_lifecycle_order
    - missing_lifecycle_step
    - post_terminal_update
    compatible_validators:
    - lifecycle
    - temporal_sequence
existing_generic_implementation:
  module: dataforge.injector.FailureInjector
  issue_types:
  - null_values
  - duplicate_records
  - datatype_mismatch
  - invalid_dates
  - negative_values
  - foreign_key_break
  - schema_drift
  - outliers
  - missing_records
  limitations:
  - Generic primitives are table/column parameterized but not always business-process
    aware.
  - Schema drift is package/schema-version oriented and should remain separated from
    ordinary row mutations.
existing_reference_implementation:
  module: dataforge.scenarios.mutations.apply_reference_scenario_mutations
  scenario_ids:
  - retail_payment_retry
  - banking_duplicate_transfer
  - healthcare_ghost_provider
  - manufacturing_defect_spike
  - telecom_tower_congestion
  - logistics_cold_chain_failure
  - finance_settlement_delay
  - insurance_coverage_exceeded
  - education_grade_calculation_error
  - ecommerce_inventory_oversell
  limitations:
  - Currently selected by explicit reference scenario IDs; future phases should replace
    branching with primitive registry dispatch.
