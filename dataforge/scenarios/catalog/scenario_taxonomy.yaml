naming_conventions:
  scenario_id: <domain>_<business_problem_slug>
  failure_category: lower_snake_case canonical category from failure_categories
  failure_primitive: lower_snake_case reusable primitive, parameterized by table/column/entity
  validator_pattern: lower_snake_case reusable validator pattern or scenario_specific
    for deep reference validators
